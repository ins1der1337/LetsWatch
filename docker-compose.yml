services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: letswatch_backend
    ports:
      - "8000:8000"
    environment:
      - DB__URL=postgresql+asyncpg://user:password@pg:5432/letswatch
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      pg:
        condition: service_healthy
    command: >
      sh -c "uv run alembic upgrade head && 
             uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

#  bot:
#    build:
#      context: ./bot
#      dockerfile: Dockerfile
#    container_name: letswatch_bot
#    env_file: ./bot/src/.env
#    depends_on:
#      - backend

  pg:
    image: postgres:17
    container_name: letswatch_db
    environment:
      POSTGRES_DB: letswatch
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user" ]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  pgdata: